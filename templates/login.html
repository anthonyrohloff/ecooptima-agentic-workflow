<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoOptima</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 18px 40px rgba(15, 43, 92, 0.16);
            border: 1px solid rgba(203, 220, 255, 0.9);
        }

        .login-eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #e8f0ff;
            color: #1f4fa3;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .login-card h1 {
            margin: 0 0 12px;
        }

        .login-copy {
            margin: 0 0 28px;
            color: #475569;
            line-height: 1.6;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-field label {
            display: block;
            margin-bottom: 8px;
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
        }

        .login-field input {
            width: 100%;
            margin: 0;
            box-sizing: border-box;
        }

        .login-password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .login-link {
            color: #1f4fa3;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .login-submit {
            width: 100%;
            margin: 8px 0 0;
            padding: 14px 16px;
            background: #0f2b5c;
            color: white;
            font-size: 15px;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0 18px;
            color: #64748b;
            font-size: 13px;
        }

        .login-divider::before,
        .login-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbe3f5;
        }

        .login-secondary {
            display: block;
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #cbdcff;
            background: #f8fbff;
            color: #0f2b5c;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            box-sizing: border-box;
        }

        .login-secondary:hover {
            background: #eef4ff;
        }

        .login-note {
            margin: 20px 0 0;
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 28px 22px;
            }

            .login-password-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <h2 class="logo">
            <a href="{{ url_for('about') }}">EcoOptima</a>
        </h2>
    </div>

    <main class="login-shell">
        <section class="login-card">
            <span class="login-eyebrow">Secure Access</span>
            <h1>Sign in to EcoOptima</h1>
            <p class="login-copy">
                Access the sustainability optimization dashboard, saved workflow context, and protected analysis tools.
            </p>

            <a class="login-secondary login-submit" href="{{ url_for('auth_start', next=request.args.get('next')) if request.args.get('next') else url_for('auth_start') }}">
                Continue with Auth0
            </a>

            <p class="login-note">
                Sign-in, password reset, and multi-factor verification are handled by Auth0 Universal Login.
            </p>

            <div class="login-footer">
                <a class="login-link" href="{{ url_for('about') }}">Learn more about EcoOptima</a>
            </div>
        </section>
    </main>
</body>

</html>
